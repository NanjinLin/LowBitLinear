
[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lowbitlinear"
version = "0.1.0"
description = "A CUDA-based low-bit quantized linear operator library"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3"
]

[tool.setuptools.packages.find]
include = ["lowbitlinear*"]
