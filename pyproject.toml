
[build-system]
requires = ["setuptools>=64", "wheel", "torch>=2.3"]
build-backend = "setuptools.build_meta"

[project]
name = "lowbitlinear"
version = "0.2.0"
description = "A CUDA-based low-bit quantized linear operator library"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3"
]

[tool.setuptools.packages.find]
include = ["lowbitlinear*"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
